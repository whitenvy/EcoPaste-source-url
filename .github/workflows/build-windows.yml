name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --no-bundle
      - name: Stage portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging/assets | Out-Null
          Copy-Item src-tauri/target/release/EcoPaste.exe staging/EcoPaste.exe
          Copy-Item src-tauri/assets/tray.ico staging/assets/tray.ico
      - uses: actions/upload-artifact@v4
        with:
          name: ecopaste-windows
          path: |
            staging/**
